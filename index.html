<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 Starship Clicker</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- TOP BAR -->
    <div class="top-bar">
        <div class="top-bar-controls">
            <button class="control-button" onclick="toggleStats()" title="Stats">📊</button>
            <button class="control-button" onclick="toggleSettings()" title="Settings">⚙️</button>
        </div>
    </div>

    <!-- STATS MODAL -->
    <div class="modal" id="stats-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Stats</h2>
                <span class="close-button" onclick="toggleStats()">&times;</span>
            </div>
            <div class="modal-body" id="stats-body"></div>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings</h2>
                <span class="close-button" onclick="toggleSettings()">&times;</span>
            </div>
            <div class="modal-body">
                <button class="modal-button" onclick="exportSave()">📤 Export</button>
                <textarea id="import-textarea" placeholder="Paste your save..."></textarea>
                <button class="modal-button" onclick="importSave()">📥 Import</button>
                <button class="modal-button delete" onclick="confirmDeleteSave()">🗑️ Delete</button>
            </div>
        </div>
    </div>

    <!-- MAIN GRID -->
    <div class="main-grid">
        <!-- LEFT PANEL - Mini-Games -->
        <div class="left-panel">
            <h3>Mini-Games</h3>
            <p>Reserved for mini-games</p>
        </div>

        <!-- CENTER PANEL - Click Zone -->
        <div class="center-panel">
            <div class="upgrades-bar" id="upgrades-bar">
                <span class="upgrades-title">Upgrades</span>
                <div class="upgrades-container-center" id="upgrades-container"></div>
            </div>
            <div class="center-content">
                <div class="medal" id="medal" onclick="addScore(1)">
                    <div class="medal-emoji">🚀</div>
                </div>
                <div class="counters">
                    <div class="counter"><span id="score-value">0</span> Parts</div>
                    <div class="counter">+<span id="gain-value">0</span>/s</div>
                    <div class="bonus-timer" id="bonus-timer"></div>
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL - Buildings -->
        <div class="right-panel">
            <div class="buildings-header">
                <h3>Buildings</h3>
                <div class="multiplier-buttons">
                    <button class="multiplier-btn" id="multiplier-x1" onclick="setBuyMultiplier(1)" title="Buy x1">x1</button>
                    <button class="multiplier-btn active" id="multiplier-x5" onclick="setBuyMultiplier(5)" title="Buy x5">x5</button>
                    <button class="multiplier-btn" id="multiplier-x50" onclick="setBuyMultiplier(50)" title="Buy x50">x50</button>
                    <button class="multiplier-btn" id="multiplier-max" onclick="setBuyMultiplier('max')" title="Buy max">Max</button>
                </div>
            </div>
            <div class="buildings-list" id="buildings-list"></div>
        </div>
    </div>

    <!-- VISUAL EFFECTS -->
    <div class="bonuses-container" id="random-bonuses"></div>
    <div class="click-effects" id="click-effects"></div>
    <div class="toast" id="toast"></div>

    <script src="script.js"></script>
</body>
</html>
