<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🇫🇷 Glory of France Clicker</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- BARRE DU HAUT (10% hauteur max) -->
    <div class="top-bar">
        <div class="top-bar-controls">
            <button class="control-button" onclick="toggleStats()" title="Statistiques">📊</button>
            <button class="control-button" onclick="toggleSettings()" title="Paramètres">⚙️</button>
        </div>
    </div>

    <!-- MODAL STATISTIQUES -->
    <div class="modal" id="stats-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Statistiques</h2>
                <span class="close-button" onclick="toggleStats()">&times;</span>
            </div>
            <div class="modal-body" id="stats-body"></div>
        </div>
    </div>

    <!-- MODAL PARAMÈTRES -->
    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Paramètres</h2>
                <span class="close-button" onclick="toggleSettings()">&times;</span>
            </div>
            <div class="modal-body">
                <button class="modal-button" onclick="exportSave()">📤 Exporter</button>
                <textarea id="import-textarea" placeholder="Collez votre sauvegarde..."></textarea>
                <button class="modal-button" onclick="importSave()">📥 Importer</button>
                <button class="modal-button delete" onclick="confirmDeleteSave()">🗑️ Supprimer</button>
            </div>
        </div>
    </div>

    <!-- GRID PRINCIPAL (3 colonnes) -->
    <div class="main-grid">
        <!-- COLONNE GAUCHE (20%) - Mini-jeux -->
        <div class="left-panel">
            <h3>Mini-Jeux</h3>
            <p>Réservé pour les mini-jeux</p>
        </div>

        <!-- COLONNE CENTRALE (60%) - Zone de clic -->
        <div class="center-panel">
            <div class="upgrades-bar" id="upgrades-bar">
                <div class="upgrades-header">
                    <h3>Améliorations</h3>
                </div>
                <div class="upgrades-container-center" id="upgrades-container"></div>
            </div>
            <div class="center-content">
                <div class="medal" id="medal" onclick="addScore(1)">
                    <div class="medal-emoji">🏅</div>
                </div>
                <div class="counters">
                    <div class="counter"><span id="score-value">0</span> Gloire</div>
                    <div class="counter">+<span id="gain-value">0</span>/s</div>
                    <div class="bonus-timer" id="bonus-timer"></div>
                </div>
            </div>
        </div>

        <!-- COLONNE DROITE (20%) - Bâtiments -->
        <div class="right-panel">
            <div class="buildings-header">
                <h3>Bâtiments</h3>
                <div class="multiplier-buttons">
                    <button class="multiplier-btn" id="multiplier-x1" onclick="setBuyMultiplier(1)" title="Acheter 1 par 1">x1</button>
                    <button class="multiplier-btn active" id="multiplier-x5" onclick="setBuyMultiplier(5)" title="Acheter par 5">x5</button>
                    <button class="multiplier-btn" id="multiplier-x50" onclick="setBuyMultiplier(50)" title="Acheter par 50">x50</button>
                    <button class="multiplier-btn" id="multiplier-max" onclick="setBuyMultiplier('max')" title="Acheter le maximum possible">Max</button>
                </div>
            </div>
            <div class="buildings-list" id="buildings-list"></div>
        </div>
    </div>

    <!-- EFFETS VISUELS -->
    <div class="bonuses-container" id="random-bonuses"></div>
    <div class="click-effects" id="click-effects"></div>
    <div class="toast" id="toast"></div>

    <script src="script.js"></script>
</body>
</html>
