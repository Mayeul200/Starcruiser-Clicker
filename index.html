<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🇫🇷 Glory of France Clicker</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- ==================== PARTIE 1 : BARRE DU HAUT (max 10% hauteur) ==================== -->
    <div class="top-bar">
        <div class="upgrades-container" id="upgrades-list"></div>
        <div class="top-bar-controls">
            <button class="control-button" onclick="toggleStats()" title="Statistiques">📊</button>
            <button class="control-button" onclick="toggleSettings()" title="Paramètres">⚙️</button>
        </div>
    </div>

    <!-- ==================== MODAL STATISTIQUES ==================== -->
    <div class="modal" id="stats-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Statistiques</h2>
                <span class="close-button" onclick="toggleStats()">&times;</span>
            </div>
            <div class="modal-body" id="stats-body"></div>
        </div>
    </div>

    <!-- ==================== MODAL PARAMÈTRES ==================== -->
    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Paramètres</h2>
                <span class="close-button" onclick="toggleSettings()">&times;</span>
            </div>
            <div class="modal-body">
                <div class="settings-section">
                    <button onclick="exportSave()" class="settings-button">⬆️ Exporter la sauvegarde</button>
                    <textarea id="import-textarea" placeholder="Coller votre sauvegarde ici..."></textarea>
                    <button onclick="importSave()" class="settings-button">⬇️ Importer la sauvegarde</button>
                    <button onclick="confirmDeleteSave()" class="settings-button delete">🗑️ Supprimer la sauvegarde</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== PARTIE 2-4 : GRID PRINCIPAL ==================== -->
    <div class="main-grid">
        <!-- Left Panel (20%) - Réservé pour mini-jeux -->
        <div class="left-panel">
            <h3>Mini-jeux</h3>
            <p style="color: #64748b; font-size: 0.9rem;">Bientôt disponibles...</p>
        </div>

        <!-- Center Panel (60%) - Médaillon + Compteurs -->
        <div class="center-panel">
            <div class="medal-container" id="medal-container">
                <div class="medal" id="medal" onclick="addScore(1)">🏅</div>
                <div class="counters">
                    <div class="counter">
                        <span class="counter-label">PDG:</span>
                        <span class="counter-value" id="score-value">0</span>
                    </div>
                    <div class="counter">
                        <span class="counter-label">/s:</span>
                        <span class="counter-value" id="gain-value">0</span>
                    </div>
                </div>
            </div>
            <div class="click-effects" id="click-effects"></div>
            <div class="medal-rain" id="medal-rain"></div>
        </div>

        <!-- Right Panel (20%) - Bâtiments -->
        <div class="right-panel">
            <h3>Bâtiments</h3>
            <div class="buildings-list" id="buildings-list"></div>
        </div>
    </div>

    <!-- Bonus aléatoires -->
    <div class="random-bonuses" id="random-bonuses"></div>

    <!-- Toast notifications -->
    <div class="toast" id="toast"></div>

    <!-- ⚡ ORDRE CORRIGÉ : save.js AVANT game.js -->
    <script src="save.js"></script>
    <script src="game.js"></script>
</body>
</html>
