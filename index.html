<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🇫🇷 Glory of France Clicker</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght=300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- ============================================
         1. BARRE DU HAUT (max 10% hauteur) - Améliorations
         ============================================ -->
    <div class="top-bar" id="top-bar">
        <!-- Conteneur des améliorations (défilement horizontal) -->
        <div class="upgrades-container" id="upgrades-list"></div>

        <!-- Boutons à droite (Statistiques + Paramètres) -->
        <div class="top-bar-controls">
            <button class="control-button stats-button" onclick="toggleStats()" title="Statistiques">
                📊 Statistiques
            </button>
            <button class="control-button settings-button" onclick="toggleSettings()" title="Paramètres">
                ⚙️ Paramètres
            </button>
        </div>
    </div>

    <!-- ============================================
         MODAL STATISTIQUES
         ============================================ -->
    <div class="stats-modal" id="stats-modal">
        <div class="stats-content">
            <div class="stats-header">
                <h2>📊 Statistiques</h2>
                <span class="close-button" onclick="toggleStats()">&times;</span>
            </div>
            <div class="stats-body" id="stats-body">
                <!-- Statistiques générées par JS -->
            </div>
        </div>
    </div>

    <!-- ============================================
         MODAL PARAMÈTRES
         ============================================ -->
    <div class="settings-modal" id="settings-modal">
        <div class="settings-content">
            <div class="settings-header">
                <h2>⚙️ Paramètres</h2>
                <span class="close-button" onclick="toggleSettings()">&times;</span>
            </div>
            <div class="settings-body">
                <div class="settings-section">
                    <button class="settings-option-button" onclick="exportSave()">
                        📤 Exporter la sauvegarde
                    </button>
                    <p class="settings-hint">Copie votre sauvegarde dans le presse-papiers.</p>
                </div>

                <div class="settings-section">
                    <div class="import-section">
                        <textarea id="import-textarea" placeholder="Collez votre sauvegarde ici..." rows="4"></textarea>
                        <button class="settings-option-button" onclick="importSave()">
                            📥 Importer la sauvegarde
                        </button>
                    </div>
                    <p class="settings-hint">Remplace votre progression actuelle.</p>
                </div>

                <div class="settings-section">
                    <button class="settings-option-button delete" onclick="confirmDeleteSave()">
                        🗑️ Supprimer la sauvegarde
                    </button>
                    <p class="settings-hint">Efface votre progression locale.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- ============================================
         2. MAIN GRID (3 colonnes)
         ============================================ -->
    <div class="main-grid">

        <!-- ============================================
             COLONNE GAUCHE (20%) - Mini-jeux
             ============================================ -->
        <div class="left-panel">
            <div class="left-panel-content">
                <h3>Mini-Jeux</h3>
                <p class="placeholder-text">Réservé pour les mini-jeux et défis spéciaux.</p>
            </div>
        </div>

        <!-- ============================================
             COLONNE CENTRALE (60%) - Zone de clic
             ============================================ -->
        <div class="center-panel">
            <div class="click-zone">
                <div class="medal" id="medal" onclick="addScore(1)">
                    <div class="medal-emoji">🏅</div>
                    <div class="medal-text">MÉDAILLE<br>DE GLOIRE</div>
                </div>
            </div>

            <div class="counters-container">
                <div class="counter">
                    <span class="counter-label">Points de Gloire :</span>
                    <span class="counter-value" id="score-value">0</span>
                </div>
                <div class="counter">
                    <span class="counter-label">PDG par seconde :</span>
                    <span class="counter-value" id="gain-value">0</span>
                </div>
            </div>
        </div>

        <!-- ============================================
             COLONNE DROITE (20%) - Bâtiments
             ============================================ -->
        <div class="right-panel">
            <div class="right-panel-header">
                <h3>Améliorations</h3>
            </div>
            <div class="buildings-list" id="buildings-list">
                <!-- Bâtiments générés par JS -->
            </div>
        </div>
    </div>

    <!-- ============================================
         CONTAINERS POUR LES EFFETS VISUELS
         ============================================ -->
    <div class="random-bonuses-container" id="random-bonuses"></div>
    <div class="click-effects-container" id="click-effects"></div>
    <div class="medal-rain-container" id="medal-rain"></div>
    <div class="toast" id="toast"></div>

    <!-- ============================================
         SCRIPTS
         ============================================ -->
    <script src="game.js"></script>
    <script src="save.js"></script>
</body>
</html>
