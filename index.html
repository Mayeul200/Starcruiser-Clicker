<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🇫🇷 Glory of France Clicker</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Barre des améliorations (en haut) -->
    <div class="upgrades-bar" id="upgrades-bar">
        <h2>Améliorations Disponibles</h2>
        <div class="upgrades-list" id="upgrades-list"></div>
    </div>

    <!-- Conteneur principal -->
    <div class="main-container">
        <!-- Zone de clic (centre) -->
        <div class="click-container">
            <div class="medal" id="medal" onclick="addScore(1)">
                <div class="medal-emoji">🏅</div>
                <div class="medal-text">MÉDAILLE<br>DE GLOIRE</div>
            </div>
            <div class="score-display">
                <div id="score">PDG : <span id="score-value">0</span></div>
                <div id="auto-gain">+<span id="gain-value">0</span>/s</div>
            </div>
        </div>

        <!-- Panneau des bâtiments (droite) -->
        <div class="buildings-panel">
            <h2>L'Aube de la France</h2>
            <div class="buildings-list" id="buildings-list"></div>
        </div>
    </div>

    <!-- Conteneur pour les bonus aléatoires (Druide & Alliance) -->
    <div class="random-bonuses-container" id="random-bonuses"></div>

    <script src="game.js"></script>
    <script src="save.js"></script>
</body>
</html>
