  <!-- Montagnes lointaines -->
  <path fill="#1a1a4a" d="M0,300 Q200,250 400,280 T800,300 L800,400 L0,400 Z"/>
  <path fill="#2a2a5a" d="M0,350 Q150,300 300,320 T600,350 L600,400 L0,400 Z"/>
  
  <!-- Étoiles -->
  <circle fill="#f5f5f5" cx="100" cy="50" r="2"/>
  <circle fill="#f5f5f5" cx="200" cy="70" r="1.5"/>
  <circle fill="#f5f5f5" cx="350" cy="40" r="2.5"/>
  <circle fill="#f5f5f5" cx="500" cy="60" r="1.5"/>
  <circle fill="#f5f5f5" cx="700" cy="50" r="2"/>
  <circle fill="#f5f5f5" cx="150" cy="100" r="1"/>
  <circle fill="#f5f5f5" cx="450" cy="80" r="1.5"/>
  <circle fill="#f5f5f5" cx="650" cy="120" r="1"/>
  
  <!-- Lune -->
  <circle fill="#e0e0e0" cx="700" cy="100" r="15"/>
  <circle fill="#0a0a2a" cx="710" cy="90" r="8"/>
</svg>